[project]
name = "gestao-patio-sambaiba-api"
version = "0.1.0"
description = "API REST do Sistema de Gestão de Pátio Sambaíba — v3.0"
authors = [
    { name = "Alisson Martins", email = "alisson84martins@gmail.com" }
]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # API
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Banco
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",

    # Configuração / validação
    "pydantic>=2.9.0",
    "pydantic-settings>=2.14.2",  # CVE-2026-58203

    # Autenticação
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",  # versão fixa pelo conflito conhecido com passlib

    # Utilitários
    "python-multipart>=0.0.31",  # upload de arquivos — PYSEC-2026-3036/3037/3040
    "openpyxl>=3.1.5",            # leitura de Excel
    "httpx>=0.27.0",              # webhook n8n (pré-ocorrência)
    "qrcode>=8.0",                 # QR do veículo (Portaria)

    # Leitura de placa por câmera (Portaria) — medida no servidor em
    # 04/09/2026 antes de plugar: 111 MB de RAM, 0,02s/foto, puramente
    # aditiva (nenhuma dependência já usada pelo projeto foi trocada).
    # Ver _handoff-claude/PROMPT-leitura-placa-engine.md.
    "fast-alpr[onnx]>=0.4.0",

    # Pisos de segurança (23/10/2026) — dependências indiretas com CVE
    # conhecido nas versões que estavam instaladas. Testado: 720 testes
    # verdes e as mesmas 251 rotas com FastAPI 0.136.1. ⚠️ Não subir o
    # FastAPI junto sem olhar: versões novas não expandem include_router em
    # app.routes e derrubam test_patio_liberados (armadilha conhecida).
    "starlette>=1.3.1",
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "pyasn1>=0.6.4",
    "idna>=3.15",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
