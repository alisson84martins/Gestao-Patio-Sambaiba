<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Suite Portaria — Registro de entrada/saída de veículos
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Portaria — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">PORTARIA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">

    <!-- D17/§1.4 — número grande é SÓ `dentro`; `sem_saida` nunca soma aqui. -->
    <div class="portaria-contador">
        <div class="portaria-contador-numero" id="portaria-contador-numero">—</div>
        <div class="portaria-contador-label">Dentro agora</div>
    </div>

    <div class="portaria-busca-bar">
        <input type="text" class="form-input" id="portaria-busca" placeholder="Placa, RE ou nome" autocomplete="off" autofocus>
        <!-- Bloco E (QR) — escondido até existir suporte a BarcodeDetector nativo. -->
        <button type="button" class="btn btn-ghost" id="btn-ler-qr" style="display:none">📷 QR</button>
    </div>

    <div class="portaria-acoes-rapidas">
        <button type="button" class="btn btn-primary" id="btn-entrada-avulsa">+ Entrada</button>
        <button type="button" class="btn btn-ghost" id="btn-terceiro">Terceiro</button>
    </div>

    <div id="portaria-candidatos" class="portaria-candidatos" style="display:none"></div>
    <div id="portaria-busca-vazia" class="oc-vazio" style="display:none">Nenhum veículo encontrado para esta busca.</div>
    <div id="portaria-busca-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:12px"></div>

    <section class="portaria-secao">
        <div class="portaria-secao-titulo">Dentro agora</div>
        <div id="lista-dentro" aria-live="polite"><div class="patio-loading">Carregando…</div></div>
    </section>

    <section class="portaria-secao portaria-secao-apagada" id="secao-sem-saida" style="display:none">
        <div class="portaria-secao-titulo">Provavelmente saíram sem registro</div>
        <div id="lista-sem-saida"></div>
    </section>

</main>

<!-- ========================================================= -->
<!-- Modal de confirmação — mesmo card pra busca, toque em      -->
<!-- "dentro agora" e (Bloco E) leitura de QR. Um único card    -->
<!-- cobre os quatro estados do semáforo (🟢🟡⚪🔴, §4.1):       -->
<!-- ⚪ (veículo não encontrado) troca o botão único "Confirmar" -->
<!-- por "Cadastrar agora" / "Registrar avulso" e libera a      -->
<!-- placa pra digitação — nos outros três estados ela só       -->
<!-- mostra o que já foi encontrado. Ver renderEstadoConfirmacao -->
<!-- em portaria.page.js.                                       -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-confirmacao">
    <div class="modal">
        <button type="button" class="modal-close" id="fechar-confirmacao">✕</button>
        <div class="modal-title" id="confirmacao-titulo">Confirmar</div>

        <div class="portaria-ficha-placa" id="confirmacao-placa-texto">—</div>
        <input type="text" class="form-input portaria-ficha-placa" id="confirmacao-placa-input" style="display:none;text-align:center;font-size:22px;margin-bottom:6px" autocomplete="off" placeholder="Placa">

        <div class="portaria-ficha-linha" id="confirmacao-dono">—</div>

        <div id="confirmacao-semaforo" class="portaria-semaforo"></div>

        <div class="form-group" id="confirmacao-sentido-wrap">
            <label class="form-label" for="confirmacao-sentido">Sentido</label>
            <select class="form-select" id="confirmacao-sentido">
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
            </select>
        </div>

        <div id="confirmacao-hodometro-wrap" style="display:none;margin-bottom:12px">
            <label class="form-label" for="confirmacao-hodometro">Hodômetro (km)</label>
            <input type="text" inputmode="numeric" class="form-input" id="confirmacao-hodometro" placeholder="Km atual">
            <div class="portaria-ficha-linha" id="confirmacao-km-entrada"></div>
        </div>

        <div class="form-group" id="confirmacao-observacao-wrap">
            <label class="form-label" for="confirmacao-observacao">Observação<span id="confirmacao-obs-obrigatoria" style="display:none;color:var(--accent)"> (obrigatória)</span></label>
            <textarea class="form-input form-textarea" id="confirmacao-observacao" rows="2" placeholder="Opcional"></textarea>
        </div>

        <div id="confirmacao-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:10px"></div>

        <!-- Estados 🟢🟡🔴: um botão só. -->
        <button type="button" class="btn btn-primary btn-full" id="btn-confirmar-movimento">Confirmar</button>

        <!-- Estado ⚪: regra número um — cadastrar OU registrar avulso, nunca recusa. -->
        <button type="button" class="btn btn-primary btn-full" id="btn-cadastrar-agora" style="display:none">Cadastrar agora</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-registrar-avulso" style="display:none">Registrar avulso</button>

        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-confirmacao">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal cadastro rápido (D1, D6) — nasce sempre PENDENTE.    -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-cadastro-rapido">
    <div class="modal">
        <button type="button" class="modal-close" id="fechar-cadastro-rapido">✕</button>
        <div class="modal-title">Cadastrar veículo</div>

        <div class="form-group">
            <label class="form-label" for="cad-placa">Placa</label>
            <input type="text" class="form-input" id="cad-placa" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label" for="cad-propriedade">Propriedade</label>
            <select class="form-select" id="cad-propriedade">
                <option value="PARTICULAR">Particular</option>
                <option value="EMPRESA">Empresa (frota)</option>
                <option value="TERCEIRO">Terceiro (prestador)</option>
            </select>
        </div>

        <div class="form-group" id="cad-dono-wrap">
            <label class="form-label" for="cad-re-dono">RE do dono</label>
            <input type="text" inputmode="numeric" class="form-input" id="cad-re-dono" autocomplete="off">
            <div class="portaria-ficha-linha" id="cad-dono-nome"></div>
        </div>

        <div class="form-group" id="cad-empresa-wrap" style="display:none">
            <label class="form-label" for="cad-empresa">Empresa terceira</label>
            <select class="form-select" id="cad-empresa"></select>
        </div>

        <div class="portaria-form-grid">
            <div class="form-group">
                <label class="form-label" for="cad-tipo">Tipo</label>
                <select class="form-select" id="cad-tipo">
                    <option value="CARRO">Carro</option>
                    <option value="MOTO">Moto</option>
                    <option value="OUTRO">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="cad-cor">Cor</label>
                <input type="text" class="form-input" id="cad-cor" autocomplete="off">
            </div>
            <div class="form-group portaria-form-grid-full">
                <label class="form-label" for="cad-marca-modelo">Marca/modelo</label>
                <input type="text" class="form-input" id="cad-marca-modelo" autocomplete="off">
            </div>
        </div>

        <div id="cadastro-rapido-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:10px"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-cadastro-rapido">Cadastrar e continuar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-cadastro-rapido">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Terceiro (D5) — empresa + veículo + condutor/destino -->
<!-- do dia. Condutor NUNCA se cadastra, é texto no movimento.  -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-terceiro">
    <div class="modal">
        <button type="button" class="modal-close" id="fechar-terceiro">✕</button>
        <div class="modal-title">Veículo de terceiro</div>

        <div class="form-group">
            <label class="form-label" for="terc-empresa">Empresa prestadora</label>
            <select class="form-select" id="terc-empresa"></select>
        </div>

        <div class="form-group">
            <label class="form-label" for="terc-placa">Placa</label>
            <input type="text" class="form-input" id="terc-placa" autocomplete="off" placeholder="Veículo já cadastrado ou novo">
            <div class="portaria-ficha-linha" id="terc-placa-status"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="terc-condutor">Quem está dirigindo hoje</label>
            <input type="text" class="form-input" id="terc-condutor" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label" for="terc-destino">Destino na garagem</label>
            <input type="text" class="form-input" id="terc-destino" autocomplete="off">
        </div>

        <div class="form-group">
            <label class="form-label" for="terc-sentido">Sentido</label>
            <select class="form-select" id="terc-sentido">
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
            </select>
        </div>

        <div id="terceiro-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:10px"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-registrar-terceiro">Registrar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-terceiro">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal leitor de QR (Bloco E) — só abre se o navegador tiver -->
<!-- BarcodeDetector nativo (o botão que chama isto nasce        -->
<!-- escondido no HTML e só aparece via JS quando há suporte).   -->
<!-- Detecção cai no MESMO card de confirmação da busca por      -->
<!-- placa (D15) — o QR é aceleração, nunca pré-requisito.        -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-qr">
    <div class="modal">
        <button type="button" class="modal-close" id="fechar-qr">✕</button>
        <div class="modal-title">Ler QR do veículo</div>
        <div class="portaria-qr-video-wrap">
            <video id="qr-video" playsinline muted></video>
        </div>
        <div id="qr-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin:10px 0"></div>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-qr">Cancelar</button>
    </div>
</div>

<script type="module" src="./assets/js/portaria.page.js"></script>
</body>
</html>
