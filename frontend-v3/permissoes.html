<!DOCTYPE html>
<!--
  Sistema de Gestão de Pátio Sambaíba — V3
  Tela de permissões — RBAC (Etapa 5)
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Permissões — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">GESTÃO DE PÁTIO</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">
    <div class="remanejo-filtros" id="permissoes-tabs">
        <button class="filtro-btn active" data-tab="funcao">Por Função</button>
        <button class="filtro-btn" data-tab="pessoa">Por Pessoa</button>
    </div>

    <!-- ========================================================= -->
    <!-- ABA POR FUNÇÃO                                             -->
    <!-- ========================================================= -->
    <section id="tab-funcao">
        <div class="permissoes-layout">
            <div id="funcoes-lista-lateral" class="permissoes-lateral">
                <div class="patio-loading">Carregando…</div>
            </div>

            <div class="permissoes-grid-area">
                <div id="permissoes-funcao-titulo" class="permissoes-grid-titulo">Selecione uma função ao lado</div>
                <div id="permissoes-funcao-grid"></div>
                <button type="button" class="btn btn-primary" id="btn-salvar-funcao" style="display:none">Salvar permissões da função</button>
                <div id="permissoes-funcao-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-top:8px"></div>
                <div id="permissoes-funcao-sucesso" style="display:none;color:var(--accent3);font-size:0.85rem;margin-top:8px"></div>
            </div>
        </div>
    </section>

    <!-- ========================================================= -->
    <!-- ABA POR PESSOA                                             -->
    <!-- ========================================================= -->
    <section id="tab-pessoa" style="display:none">
        <div class="permissoes-layout">
            <div class="permissoes-lateral">
                <input type="text" class="form-input" id="pessoa-busca" placeholder="Buscar por nome ou RE…" autocomplete="off">
                <div id="pessoa-resultados" class="permissoes-pessoa-resultados"></div>
            </div>

            <div class="permissoes-grid-area">
                <div id="permissoes-pessoa-titulo" class="permissoes-grid-titulo">Busque uma pessoa ao lado</div>
                <div id="permissoes-pessoa-grid"></div>
                <button type="button" class="btn btn-primary" id="btn-salvar-pessoa" style="display:none">Salvar exceções da pessoa</button>
                <div id="permissoes-pessoa-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-top:8px"></div>
                <div id="permissoes-pessoa-sucesso" style="display:none;color:var(--accent3);font-size:0.85rem;margin-top:8px"></div>
            </div>
        </div>
    </section>
</main>

<script type="module" src="./assets/js/permissoes.js"></script>
</body>
</html>
