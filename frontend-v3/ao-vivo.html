<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Suite Fiscalização — Ao vivo da linha (SIM SPTrans → sistema, migration 053)
  O fiscal em campo e a coordenação acompanham no celular, sem SIM nem extensão.
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0a0a">
    <title>Ao vivo — Fiscalização — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">AO VIVO</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="av-main">

    <div class="av-status av-status-aviso" id="av-status" role="status" aria-live="polite">Carregando…</div>
    <div class="av-erro" id="av-erro" hidden></div>

    <div class="av-tela">
        <div class="av-mapa" id="av-mapa" aria-label="Mapa da linha"></div>

        <aside class="av-painel">
            <div class="av-linha">
                <div class="av-linha-nome" id="av-linha-nome">—</div>
                <div class="av-legenda">
                    <span><i class="av-bolinha av-s1"></i><span id="av-leg-s1">Sentido 1</span></span>
                    <span><i class="av-bolinha av-s2"></i><span id="av-leg-s2">Sentido 2</span></span>
                </div>
                <div class="av-contadores" id="av-contadores"></div>
            </div>

            <section class="av-secao">
                <h2 class="av-secao-titulo">Alertas agora <span class="av-pilula av-pilula-zero" id="av-n-alertas">0</span></h2>
                <div id="av-alertas"></div>
            </section>

            <section class="av-secao">
                <h2 class="av-secao-titulo">Carros</h2>
                <div id="av-carros"></div>
            </section>

            <section class="av-secao">
                <h2 class="av-secao-titulo">Ocorrências do dia</h2>
                <div id="av-ocorrencias"></div>
            </section>

            <p class="av-rodape">Posições do SIM SPTrans, lidas a cada minuto pelo robô da coordenação. Esta tela atualiza a cada 30 s. Toque num carro para ver o rastro dos últimos 90 min.</p>
        </aside>
    </div>

</main>

<!-- Leaflet 1.9.4 vendorizado (sem CDN): script clássico, expõe window.L. -->
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script type="module" src="./assets/js/ao-vivo.page.js"></script>
</body>
</html>
