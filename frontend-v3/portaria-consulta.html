<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Consulta — Portaria — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">PORTARIA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">

    <div class="remanejo-filtros" style="flex-wrap:wrap">
        <input type="date" class="form-input" id="filtro-data-inicio" style="max-width:160px" title="Data inicial">
        <input type="date" class="form-input" id="filtro-data-fim" style="max-width:160px" title="Data final">
        <input type="text" class="form-input" id="filtro-placa" placeholder="Placa" style="max-width:120px" autocomplete="off">
        <input type="text" class="form-input" id="filtro-re" placeholder="RE" style="max-width:120px" autocomplete="off" inputmode="numeric">
        <select class="form-select" id="filtro-propriedade" style="max-width:170px">
            <option value="">Toda propriedade</option>
            <option value="PARTICULAR">Particular</option>
            <option value="EMPRESA">Empresa</option>
            <option value="TERCEIRO">Terceiro</option>
        </select>
        <select class="form-select" id="filtro-sentido" style="max-width:150px">
            <option value="">Entrada e saída</option>
            <option value="ENTRADA">Só entrada</option>
            <option value="SAIDA">Só saída</option>
        </select>
    </div>

    <div class="remanejo-filtros" style="flex-wrap:wrap">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
            <input type="checkbox" id="filtro-nao-cadastrados"> Só não cadastrados
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)">
            <input type="checkbox" id="filtro-suspensos"> Só de veículos suspensos
        </label>
        <button type="button" class="btn btn-ghost" id="btn-limpar-filtros">Limpar</button>
        <button type="button" class="btn btn-ghost" id="btn-sem-saida-24h">Sem saída há 24h+</button>
        <button type="button" class="btn btn-primary" id="btn-exportar-csv" style="margin-left:auto">Exportar CSV</button>
    </div>

    <div id="consulta-resumo" style="color:var(--muted);font-size:0.8rem;margin-bottom:8px"></div>
    <div id="consulta-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:8px"></div>

    <div class="portaria-tabela-wrap">
        <table class="portaria-tabela">
            <thead>
                <tr>
                    <th>Data/hora</th>
                    <th>Sentido</th>
                    <th>Placa</th>
                    <th>RE</th>
                    <th>Nome</th>
                    <th>Origem</th>
                    <th>Observação</th>
                </tr>
            </thead>
            <tbody id="consulta-corpo">
                <tr><td colspan="7" class="oc-vazio">Carregando…</td></tr>
            </tbody>
        </table>
    </div>

    <div style="display:flex;justify-content:center;gap:12px;margin-top:16px">
        <button type="button" class="btn btn-ghost" id="btn-pagina-anterior" disabled>‹ Anterior</button>
        <button type="button" class="btn btn-ghost" id="btn-proxima-pagina" disabled>Próxima ›</button>
    </div>

</main>

<script type="module" src="./assets/js/portaria-consulta.page.js"></script>
</body>
</html>
