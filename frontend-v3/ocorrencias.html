<!DOCTYPE html>
<!--
  Sistema de Gestão de Pátio Sambaíba — V3
  Suite Coordenadoria — Relatório de Ocorrências (lista)
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Ocorrências — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">COORDENADORIA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">

    <!-- Barra de filtros -->
    <div class="remanejo-filtros" id="ocorrencias-filtros" style="flex-wrap:wrap">
        <input type="date" class="form-input" id="filtro-data-inicio" style="max-width:160px" title="Data inicial">
        <input type="date" class="form-input" id="filtro-data-fim" style="max-width:160px" title="Data final">
        <select class="form-select" id="filtro-tipo" style="max-width:220px">
            <option value="">Todos os tipos</option>
        </select>
        <input type="text" class="form-input" id="filtro-prefixo" placeholder="Prefixo" style="max-width:120px" autocomplete="off">
        <input type="text" class="form-input" id="filtro-linha" placeholder="Linha" style="max-width:120px" autocomplete="off">
        <select class="form-select" id="filtro-status" style="max-width:160px">
            <option value="">Todos os status</option>
            <option value="RASCUNHO">Rascunho</option>
            <option value="FINALIZADA">Finalizada</option>
            <option value="CANCELADA">Cancelada</option>
        </select>
        <button type="button" class="btn btn-ghost" id="btn-limpar-filtros">Limpar</button>
        <button type="button" class="btn btn-primary" id="btn-nova-ocorrencia" style="margin-left:auto">+ Nova Ocorrência</button>
    </div>

    <div id="ocorrencias-resumo" style="color:var(--muted);font-size:0.8rem;margin-bottom:8px"></div>
    <div id="ocorrencias-erro-acao" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:8px"></div>

    <section id="ocorrencias-lista" aria-live="polite">
        <div class="patio-loading">Carregando…</div>
    </section>

    <div style="display:flex;justify-content:center;gap:12px;margin-top:16px">
        <button type="button" class="btn btn-ghost" id="btn-pagina-anterior" disabled>‹ Anterior</button>
        <button type="button" class="btn btn-ghost" id="btn-proxima-pagina" disabled>Próxima ›</button>
    </div>

</main>

<!-- ========================================================= -->
<!-- Modal Mensagem do Sinistro — reaproveitado por             -->
<!-- ocorrencia.sinistro.js, o mesmo módulo usado no formulário -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-sinistro">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-sinistro-fechar">✕</button>
        <div class="modal-title">Mensagem do Grupo do Sinistro</div>
        <div id="sinistro-carregando" class="oc-vazio">Gerando mensagem…</div>
        <div id="sinistro-conteudo" style="display:none">
            <div class="oc-mensagem-box" id="sinistro-texto"></div>
            <button type="button" class="btn btn-primary btn-full" id="btn-sinistro-copiar">📋 Copiar</button>
            <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-sinistro-compartilhar">📤 Compartilhar</button>
        </div>
        <div id="sinistro-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-top:8px"></div>
    </div>
</div>

<!-- Área de impressão — oculta em tela, visível ao imprimir -->
<div id="print-content"></div>

<script type="module" src="./assets/js/ocorrencias.page.js"></script>
</body>
</html>
