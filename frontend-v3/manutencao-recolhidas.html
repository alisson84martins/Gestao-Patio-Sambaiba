<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Suite Portaria — Fila de recolhidas anormais (Bloco F)
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Recolhidas — Portaria — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">PORTARIA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">

    <div class="portaria-contador">
        <div class="portaria-contador-numero" id="rec-contador-numero">—</div>
        <div class="portaria-contador-label">Aguardando avaliação</div>
    </div>

    <section class="portaria-secao">
        <div id="rec-lista-pendentes"><div class="patio-loading">Carregando…</div></div>
    </section>

    <!-- ===================================================== -->
    <!-- Visão gerencial — só aparece se a API devolver os      -->
    <!-- campos (recurso recolhida_gerencial). Quem não tem o   -->
    <!-- recurso nunca recebe motorista/cobrador da API — não é -->
    <!-- só esconder na tela (§2.5).                            -->
    <!-- ===================================================== -->
    <section class="portaria-secao" id="secao-gerencial" style="display:none">
        <div class="portaria-secao-titulo">Análise — melhoria de processo e de frota</div>
        <p class="portaria-ficha-linha" style="margin-bottom:12px">O dado é do veículo, não da pessoa — serve pra encontrar padrão de operação e necessidade de treinamento.</p>
        <div id="gerencial-agregados"></div>
    </section>

</main>

<!-- ========================================================= -->
<!-- Avaliação — LIBERADO (com prazo) ou RETIDO.                -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-avaliacao">
    <div class="modal">
        <button type="button" class="modal-close" id="fechar-avaliacao">✕</button>
        <div class="modal-title">Avaliar recolhida</div>

        <div class="portaria-ficha-placa" id="aval-prefixo">—</div>
        <div class="portaria-ficha-linha" id="aval-linha"></div>
        <div class="portaria-ficha-linha" id="aval-defeito"></div>
        <div class="portaria-ficha-linha" id="aval-relato"></div>
        <div class="portaria-ficha-linha" id="aval-ficha" style="color:var(--muted);margin-top:6px"></div>

        <div style="display:flex;gap:8px;margin:16px 0 10px">
            <button type="button" class="btn btn-primary" id="btn-liberado" style="flex:1">LIBERADO</button>
            <button type="button" class="btn btn-danger" id="btn-retido" style="flex:1">RETIDO</button>
        </div>

        <div id="aval-prazo-wrap" style="display:none;margin-bottom:10px">
            <label class="form-label">Prazo</label>
            <div class="recolhida-chips" id="aval-prazo-atalhos">
                <button type="button" class="recolhida-chip" data-min="15">15 min</button>
                <button type="button" class="recolhida-chip" data-min="30">30 min</button>
                <button type="button" class="recolhida-chip" data-min="60">1h</button>
                <button type="button" class="recolhida-chip" data-min="120">2h</button>
                <button type="button" class="recolhida-chip" data-min="outro">Outro</button>
            </div>
            <input type="text" inputmode="numeric" class="form-input" id="aval-prazo-input"
                   placeholder="Minutos" style="display:none;margin-top:8px">
        </div>

        <div class="form-group">
            <label class="form-label" for="aval-observacao">Observação (opcional)</label>
            <textarea class="form-input form-textarea" id="aval-observacao" rows="2"></textarea>
        </div>

        <div id="aval-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:10px"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-confirmar-avaliacao" style="display:none">Confirmar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-avaliacao">Cancelar</button>
    </div>
</div>

<script type="module" src="./assets/js/manutencao-recolhidas.page.js"></script>
</body>
</html>
