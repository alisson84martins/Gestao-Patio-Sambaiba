<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Suite Portaria — Recolhida anormal (Blocos F + G)
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0a0a">
    <title>Recolhida — Portaria — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">PORTARIA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<!-- ========================================================= -->
<!-- §2.9-0: o controlador DIGITA RE motorista/cobrador — é a   -->
<!-- melhor fonte do dado. O que ele NUNCA vê é o acumulado      -->
<!-- (histórico/análise — isso é recolhida_gerencial).            -->
<!-- ========================================================= -->
<main class="patio-main">

    <!-- Bloco C — sem link próprio na barra (nav.js), a página fica só com ativo:'portaria.html'. -->
    <a href="portaria.html" class="btn btn-ghost" style="display:inline-block;margin-bottom:16px">&larr; Voltar</a>

    <div class="recolhida-campo">
        <label class="form-label" for="rec-prefixo">Carro</label>
        <input type="text" class="form-input recolhida-input-grande" id="rec-prefixo"
               inputmode="numeric" autocomplete="off" autofocus placeholder="Prefixo">
        <div id="rec-prefixo-status" class="portaria-ficha-linha"></div>
    </div>

    <div class="recolhida-campo">
        <label class="form-label" for="rec-linha-busca">Linha</label>
        <input type="text" class="form-input" id="rec-linha-busca" autocomplete="off" placeholder="Toque numa linha">
        <div id="rec-linha-sugestoes" class="recolhida-chips"></div>
        <div id="rec-linha-selecionada" class="portaria-ficha-linha"></div>
    </div>

    <div class="recolhida-campo">
        <label class="form-label" for="rec-motorista-re">RE motorista</label>
        <input type="text" class="form-input" id="rec-motorista-re" inputmode="numeric" autocomplete="off">
        <div id="rec-motorista-status" class="portaria-ficha-linha"></div>
        <input type="text" class="form-input" id="rec-motorista-nome" placeholder="Nome (RE não encontrado)" style="display:none;margin-top:6px">
    </div>

    <div class="recolhida-campo">
        <label class="form-label" for="rec-cobrador-re">RE cobrador</label>
        <input type="text" class="form-input" id="rec-cobrador-re" inputmode="numeric" autocomplete="off">
        <div id="rec-cobrador-status" class="portaria-ficha-linha"></div>
        <input type="text" class="form-input" id="rec-cobrador-nome" placeholder="Nome (RE não encontrado)" style="display:none;margin-top:6px">
    </div>

    <div class="recolhida-campo">
        <label class="form-label">Motivo</label>
        <div id="rec-motivos" class="recolhida-chips"></div>
    </div>

    <div class="recolhida-campo" id="rec-defeito-campo">
        <label class="form-label">Defeito</label>
        <div id="rec-categorias" class="recolhida-chips"></div>
        <div id="rec-tipos" class="recolhida-chips"></div>
        <div id="rec-defeito-selecionado" class="portaria-ficha-linha"></div>
    </div>

    <div class="recolhida-campo">
        <label class="form-label" for="rec-relato">Relato (opcional)</label>
        <textarea class="form-input form-textarea" id="rec-relato" rows="1"></textarea>
    </div>

    <div id="rec-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:10px"></div>

    <button type="button" class="btn btn-primary btn-full" id="btn-registrar-recolhida">REGISTRAR</button>

    <section class="portaria-secao" style="margin-top:24px">
        <div class="portaria-secao-titulo">Suas últimas recolhidas</div>
        <div id="rec-lista-turno"><div class="patio-loading">Carregando…</div></div>
    </section>

</main>

<script type="module" src="./assets/js/portaria-recolhida.page.js"></script>
</body>
</html>
