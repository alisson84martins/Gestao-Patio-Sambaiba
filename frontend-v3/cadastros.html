<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Tela de Cadastros — Fase 5.8 — Gestão de entidades (somente ADMIN)
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0a0a">
    <title>Cadastros — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">GESTÃO OPERACIONAL SAMBAÍBA</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<!-- Navegação entre telas -->
<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main">

    <!-- Abas internas da página de cadastros -->
    <div class="remanejo-filtros" id="cadastros-tabs" style="flex-wrap:wrap;gap:4px">
        <button class="filtro-btn active" data-tab="usuarios">Funcionários</button>
        <button class="filtro-btn" data-tab="onibus">Ônibus</button>
        <button class="filtro-btn" data-tab="motoristas">Motoristas</button>
        <button class="filtro-btn" data-tab="linhas">Linhas</button>
        <button class="filtro-btn" data-tab="filas">Filas</button>
        <button class="filtro-btn" data-tab="tipos-defeito">Tipos de Defeito</button>
        <!-- Bloco F — recurso próprio (pre_cadastro), não "usuarios": pode ficar
             invisível pra quem entra na tela mas não tem esse recurso (ver
             aplicarVisibilidadeAbaPreCadastro em cadastros.js). -->
        <button class="filtro-btn" data-tab="pre-cadastros">Pré-cadastros</button>
        <button class="btn btn-primary" id="btn-novo" style="margin-left:auto">+ Novo</button>
    </div>

    <!-- Barra de busca -->
    <div style="padding:0 0 12px">
        <input type="text" class="form-input" id="cadastros-busca"
               placeholder="Buscar…" autocomplete="off"
               style="max-width:320px">
    </div>

    <!-- Conteúdo da aba ativa -->
    <section id="cadastros-lista" aria-live="polite">
        <div class="patio-loading">Carregando…</div>
    </section>

</main>

<!-- ========================================================= -->
<!-- Modal Usuário                                              -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-usuario">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-usuario-fechar">✕</button>
        <div class="modal-title" id="modal-usuario-titulo">Novo Funcionário</div>

        <input type="hidden" id="usuario-id">

        <div class="form-group">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
                <label class="form-label" for="usuario-re" style="margin:0">RE (Registro de Funcionário) <span style="color:var(--accent)">*</span></label>
                <button type="button" class="btn btn-ghost" id="btn-alterar-re" style="display:none;font-size:11px;padding:4px 10px;white-space:nowrap">Alterar RE</button>
            </div>
            <input type="text" class="form-input" id="usuario-re" placeholder="Ex: 19042 ou A4011" inputmode="text" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="usuario-nome">Nome Completo <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="usuario-nome" placeholder="Ex: João da Silva" maxlength="120">
        </div>

        <div class="form-group" id="usuario-cpf-group">
            <label class="form-label" for="usuario-cpf">
                CPF <span style="color:var(--accent)">*</span>
                <span style="color:#888;font-size:0.8rem;font-weight:400"> — últimos 4 dígitos viram a senha inicial do acesso</span>
            </label>
            <input type="text" class="form-input" id="usuario-cpf" placeholder="000.000.000-00" maxlength="14">
        </div>

        <div class="form-group">
            <label class="form-label" for="usuario-rg">RG</label>
            <input type="text" class="form-input" id="usuario-rg" placeholder="Ex: 12.345.678-9" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="usuario-cnh">CNH</label>
            <input type="text" class="form-input" id="usuario-cnh" placeholder="Ex: 12345678900" inputmode="numeric" maxlength="20">
        </div>

        <div id="modal-usuario-conflito" class="modulos-aviso" style="display:none;margin-bottom:0.75rem">
            <div id="modal-usuario-conflito-texto"></div>
            <button type="button" class="btn btn-ghost btn-full" id="btn-abrir-existente" style="margin-top:8px">Abrir cadastro existente</button>
        </div>

        <div class="form-group">
            <label class="form-label">Funções <span style="color:var(--accent)">*</span></label>
            <div id="usuario-funcoes-lista" class="funcoes-lista"></div>
            <div style="color:#888;font-size:0.75rem;margin-top:4px">A função de maior hierarquia entre as marcadas vira automaticamente a principal.</div>
        </div>

        <div class="form-group" id="usuario-ativo-group">
            <label class="form-label" for="usuario-status">Status</label>
            <select class="form-select" id="usuario-status">
                <option value="ATIVO">Ativo</option>
                <option value="AFASTADO">Afastado</option>
                <option value="FERIAS">Férias</option>
                <option value="DESLIGADO">Desligado</option>
            </select>
        </div>

        <div class="form-group" id="usuario-acesso-area" style="display:none">
            <label class="form-label">Acesso ao sistema</label>
            <button type="button" class="btn btn-ghost btn-full" id="btn-criar-acesso">Criar acesso ao sistema</button>
            <div id="usuario-acesso-resultado" style="display:none;color:var(--accent3);font-size:0.85rem;margin-top:6px"></div>
        </div>

        <div id="modal-usuario-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-usuario">Salvar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-usuario">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Ônibus                                               -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-onibus">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-onibus-fechar">✕</button>
        <div class="modal-title" id="modal-onibus-titulo">Novo Ônibus</div>

        <input type="hidden" id="onibus-id">

        <div class="form-group">
            <label class="form-label" for="onibus-frota">Número de Frota <span style="color:var(--accent)">*</span></label>
            <input type="number" class="form-input" id="onibus-frota" placeholder="Ex: 1042" min="1000" max="9999">
        </div>

        <div class="form-group">
            <label class="form-label">Setor</label>
            <div id="onibus-setor-display" style="padding:8px 12px;background:var(--surface-2);border-radius:4px;font-family:monospace;color:#888">
                Calculado automaticamente pelo banco
            </div>
        </div>

        <div class="form-group" id="onibus-status-group">
            <label class="form-label" for="onibus-status">Status</label>
            <select class="form-select" id="onibus-status">
                <option value="ATIVO">Ativo</option>
                <option value="MANUTENCAO">Manutenção</option>
                <option value="RESERVA">Reserva</option>
                <option value="INATIVO">Inativo</option>
            </select>
        </div>

        <div id="modal-onibus-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-onibus">Salvar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-onibus">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Motorista                                            -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-motorista">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-motorista-fechar">✕</button>
        <div class="modal-title" id="modal-motorista-titulo">Novo Motorista</div>

        <input type="hidden" id="motorista-id">

        <div class="form-group">
            <label class="form-label" for="motorista-re">RE <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="motorista-re" placeholder="Ex: 19042" inputmode="numeric" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="motorista-nome">Nome Completo <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="motorista-nome" placeholder="Ex: João da Silva" maxlength="120">
        </div>

        <div class="form-group">
            <label class="form-label" for="motorista-cpf">CPF</label>
            <input type="text" class="form-input" id="motorista-cpf" placeholder="000.000.000-00" maxlength="14">
        </div>

        <div class="form-group" id="motorista-status-group">
            <label class="form-label" for="motorista-status">Status</label>
            <select class="form-select" id="motorista-status">
                <option value="ATIVO">Ativo</option>
                <option value="AFASTADO">Afastado</option>
                <option value="FERIAS">Férias</option>
                <option value="DESLIGADO">Desligado</option>
            </select>
        </div>

        <div id="modal-motorista-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-motorista">Salvar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-motorista">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Linha                                                -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-linha">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-linha-fechar">✕</button>
        <div class="modal-title" id="modal-linha-titulo">Nova Linha</div>

        <input type="hidden" id="linha-id">

        <div class="form-group">
            <label class="form-label" for="linha-codigo">Código <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="linha-codigo" placeholder="Ex: 8500-10" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="linha-nome">Nome <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="linha-nome" placeholder="Ex: Metrô Penha" maxlength="100">
        </div>

        <div class="form-group">
            <label class="form-label" for="linha-setor">Setor <span style="color:var(--accent)">*</span></label>
            <select class="form-select" id="linha-setor">
                <option value="E2">E2</option>
                <option value="AR2">AR2</option>
            </select>
        </div>

        <div class="form-group" id="linha-ativa-group">
            <label class="form-label" for="linha-ativa">Status</label>
            <select class="form-select" id="linha-ativa">
                <option value="true">Ativa</option>
                <option value="false">Inativa</option>
            </select>
        </div>

        <div id="modal-linha-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-linha">Salvar</button>
        <button type="button" class="btn btn-danger btn-full btn-modal-stack" id="btn-excluir-linha" style="display:none">Excluir Linha</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-linha">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Fila — só edição do apelido/abreviação; catálogo de   -->
<!-- filas (nome, tipo, número) vem das migrations, não daqui.  -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-fila">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-fila-fechar">✕</button>
        <div class="modal-title" id="modal-fila-titulo">Fila</div>

        <input type="hidden" id="fila-id">

        <div class="form-group">
            <label class="form-label">Nome</label>
            <div id="fila-nome-display" style="padding:8px 12px;background:var(--surface-2);border-radius:4px;color:#888"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="fila-abreviacao">
                Abreviação <span style="color:#888;font-size:0.8rem;font-weight:400"> — rótulo curto pra impressão e chips; em branco usa o nome</span>
            </label>
            <input type="text" class="form-input" id="fila-abreviacao" placeholder="Ex: COQ" maxlength="6" style="text-transform:uppercase">
        </div>

        <div class="form-group" id="fila-ativa-group">
            <label class="form-label" for="fila-ativa">Status</label>
            <select class="form-select" id="fila-ativa">
                <option value="true">Ativa</option>
                <option value="false">Inativa</option>
            </select>
        </div>

        <div id="modal-fila-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-fila">Salvar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-fila">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Tipo de Defeito                                      -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-tipo-defeito">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-tipo-fechar">✕</button>
        <div class="modal-title" id="modal-tipo-titulo">Novo Tipo de Defeito</div>

        <input type="hidden" id="tipo-id">

        <div class="form-group">
            <label class="form-label" for="tipo-nome">Nome <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="tipo-nome" placeholder="Ex: Freios" maxlength="80">
        </div>

        <div id="modal-tipo-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-salvar-tipo">Salvar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-tipo">Cancelar</button>
    </div>
</div>

<!-- ========================================================= -->
<!-- Modal Pré-cadastro (Bloco F) — completar e promover, ou     -->
<!-- descartar. Nunca cria acesso ao sistema (só funcionario).   -->
<!-- ========================================================= -->
<div class="modal-overlay" id="modal-pre-cadastro">
    <div class="modal">
        <button type="button" class="modal-close" id="modal-pre-cadastro-fechar">✕</button>
        <div class="modal-title">Completar e promover</div>

        <input type="hidden" id="pc-id">

        <div class="form-group">
            <label class="form-label">RE</label>
            <div id="pc-re-display" style="padding:8px 12px;background:var(--surface-2);border-radius:4px;font-family:var(--mono)"></div>
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-nome">Nome Completo <span style="color:var(--accent)">*</span></label>
            <input type="text" class="form-input" id="pc-nome" placeholder="Ex: João da Silva" maxlength="120">
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-cpf">CPF</label>
            <input type="text" class="form-input" id="pc-cpf" placeholder="000.000.000-00" maxlength="14">
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-rg">RG</label>
            <input type="text" class="form-input" id="pc-rg" placeholder="Ex: 12.345.678-9" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-cnh">CNH</label>
            <input type="text" class="form-input" id="pc-cnh" inputmode="numeric" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-telefone">Telefone</label>
            <input type="text" class="form-input" id="pc-telefone" maxlength="20">
        </div>

        <div class="form-group">
            <label class="form-label" for="pc-papel">Papel sugerido</label>
            <select class="form-select" id="pc-papel">
                <option value="INDEFINIDO">Indefinido</option>
                <option value="MOTORISTA">Motorista</option>
                <option value="COBRADOR">Cobrador</option>
            </select>
        </div>

        <!-- Origem/contagem/retenção (LGPD) — só leitura, vêm do que a
             operação já acumulou (services/pre_cadastro.py). -->
        <div class="portaria-ficha-linha" id="pc-meta" style="margin-bottom:0.75rem;color:var(--muted)"></div>

        <div id="modal-pre-cadastro-erro" style="display:none;color:var(--accent);font-size:0.85rem;margin-bottom:0.75rem;"></div>

        <button type="button" class="btn btn-primary btn-full" id="btn-promover-pre-cadastro">Completar e promover</button>
        <button type="button" class="btn btn-danger btn-full btn-modal-stack" id="btn-descartar-pre-cadastro">Descartar</button>
        <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-pre-cadastro">Cancelar</button>

        <div id="pc-descarte-wrap" style="display:none;margin-top:10px">
            <label class="form-label" for="pc-descarte-motivo">Motivo do descarte <span style="color:var(--accent)">*</span></label>
            <textarea class="form-input form-textarea" id="pc-descarte-motivo" rows="2"></textarea>
            <button type="button" class="btn btn-primary btn-full" id="btn-confirmar-descarte" style="margin-top:8px">Confirmar descarte</button>
            <button type="button" class="btn btn-ghost btn-full btn-modal-stack" id="btn-cancelar-descarte">Cancelar</button>
        </div>
    </div>
</div>

<script type="module" src="./assets/js/cadastros.js"></script>
</body>
</html>
