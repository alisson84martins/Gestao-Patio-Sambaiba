<!DOCTYPE html>
<!--
  Sistema de Gestão Operacional Sambaíba — V3
  Painel Gerencial — tudo que a Portaria e o Pátio registram, ao vivo e
  histórico. SÓ LEITURA (migration 046).
  Desenvolvido por Alisson Martins
  © 2026 — Todos os direitos reservados
-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0a0a">
    <title>Painel Gerencial — Sambaíba V3</title>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="app-header">
    <div class="app-header-brand">
        <img class="app-header-logo" src="assets/img/sambaiba-logo.jpg" alt="Eu amo Sambaíba">
        <div class="app-header-titles">
            <div class="app-header-empresa">Sambaíba</div>
            <div class="app-header-title">PAINEL GERENCIAL</div>
        </div>
    </div>

    <div class="app-header-user">
        <div class="app-user-info">
            <div class="app-user-name" id="user-name">—</div>
            <div class="app-user-meta" id="user-meta">—</div>
        </div>
        <button class="btn-logout" id="btn-logout" title="Sair">Sair</button>
    </div>
</header>

<nav class="app-nav"></nav>
<script type="module" src="./assets/js/nav.js"></script>

<main class="patio-main pg-main">

    <!-- Topo fixo: período + selo ao vivo/histórico + ações -->
    <div class="pg-topo">
        <div class="pg-topo-linha">
            <h1 class="pg-titulo">Painel Gerencial</h1>
            <span class="pg-selo" id="pg-selo" hidden></span>
            <div class="pg-acoes">
                <button type="button" class="btn btn-ghost pg-btn" id="pg-btn-csv">Exportar CSV</button>
                <button type="button" class="btn btn-ghost pg-btn" id="pg-btn-imprimir">Imprimir</button>
            </div>
        </div>

        <div class="pg-periodos" id="pg-periodos" role="group" aria-label="Período">
            <button type="button" class="filtro-btn active" data-preset="hoje">Hoje</button>
            <button type="button" class="filtro-btn" data-preset="ontem">Ontem</button>
            <button type="button" class="filtro-btn" data-preset="7d">7 dias</button>
            <button type="button" class="filtro-btn" data-preset="30d">30 dias</button>
            <button type="button" class="filtro-btn" data-preset="mes">Mês atual</button>
            <button type="button" class="filtro-btn" data-preset="inicio">Desde o início</button>
            <button type="button" class="filtro-btn" data-preset="personalizado">Personalizado</button>
        </div>

        <div class="pg-personalizado" id="pg-personalizado" hidden>
            <label class="pg-campo-data">De <input type="date" class="form-input" id="pg-de"></label>
            <label class="pg-campo-data">Até <input type="date" class="form-input" id="pg-ate"></label>
            <button type="button" class="btn btn-primary pg-btn" id="pg-aplicar">Aplicar</button>
        </div>

        <div class="pg-desde" id="pg-desde">—</div>
    </div>

    <div class="pg-erro" id="pg-erro" hidden></div>

    <!-- Contadores do período: só número e rótulo, iguais em todas as abas -->
    <div class="pg-contadores" id="pg-contadores"><div class="patio-loading">Carregando…</div></div>

    <div class="pg-abas" role="tablist">
        <button type="button" class="filtro-btn active" role="tab" aria-selected="true" data-aba="">Tudo</button>
        <button type="button" class="filtro-btn" role="tab" aria-selected="false" data-aba="PORTARIA">Portaria</button>
        <button type="button" class="filtro-btn" role="tab" aria-selected="false" data-aba="PATIO">Pátio</button>
    </div>

    <!-- A mesma lista de registros nas três abas; a aba só pré-filtra o módulo -->
    <section class="pg-registros">
        <div class="pg-filtros">
            <select class="form-input" id="pg-f-tipo" aria-label="Tipo"></select>
            <input type="search" class="form-input" id="pg-f-busca" maxlength="60"
                   placeholder="Placa, prefixo, RE ou nome" aria-label="Buscar">
        </div>
        <div class="pg-tabela-caixa">
            <table class="pg-tabela">
                <thead>
                    <tr>
                        <th scope="col">Hora</th>
                        <th scope="col">Tipo</th>
                        <th scope="col">Veículo</th>
                        <th scope="col">Detalhe</th>
                        <th scope="col">Pessoa</th>
                        <th scope="col">Registrado por</th>
                    </tr>
                </thead>
                <tbody id="pg-lista"></tbody>
            </table>
        </div>
        <div class="pg-lista-rodape">
            <button type="button" class="btn btn-ghost pg-btn" id="pg-mais" hidden>Carregar mais</button>
        </div>
    </section>

</main>

<!-- Detalhe do evento — só leitura -->
<div class="modal-overlay" id="pg-modal">
    <div class="modal">
        <button type="button" class="modal-close" id="pg-modal-fechar" aria-label="Fechar">&times;</button>
        <div class="modal-title" id="pg-modal-titulo">Evento</div>
        <dl class="pg-detalhe" id="pg-modal-corpo"></dl>
    </div>
</div>

<script type="module" src="./assets/js/painel-gerencial.page.js"></script>
</body>
</html>
